<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=New+Amsterdam&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Activity</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      body {
        font-family: "Roboto", system-ui;
      }
      #map {
        height: 500px;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8 flex flex-col items-center gap-6">

      <div class="w-full text-center rounded-2xl bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 border border-indigo-800/40 shadow-lg shadow-indigo-500/10 py-6">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight bg-gradient-to-r from-cyan-400 via-blue-400 to-violet-400 bg-clip-text text-transparent">
          Death Star Tracker
        </h1>
        <p class="text-slate-400 text-sm mt-2 tracking-widest uppercase">Real-Time Orbital Tracking</p>
      </div>

      <div class="w-full grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="rounded-xl bg-slate-900 border border-slate-800 p-4 text-center shadow-md">
          <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Latitude</p>
          <p id="latitude" class="text-lg font-semibold text-cyan-400"></p>
        </div>
        <div class="rounded-xl bg-slate-900 border border-slate-800 p-4 text-center shadow-md">
          <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Longitude</p>
          <p id="longitude" class="text-lg font-semibold text-cyan-400"></p>
        </div>
        <div class="rounded-xl bg-slate-900 border border-slate-800 p-4 text-center shadow-md">
          <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Velocity</p>
          <p id="velocity" class="text-lg font-semibold text-violet-400"></p>
        </div>
        <div class="rounded-xl bg-slate-900 border border-slate-800 p-4 text-center shadow-md">
          <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Altitude</p>
          <p id="altitude" class="text-lg font-semibold text-violet-400"></p>
        </div>
      </div>

      <button
        id="find-button"
        onclick="findStar()"
        class="px-8 py-3 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold text-base shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:scale-105 active:scale-95 active:shadow-none transition-all duration-200 cursor-pointer"
      >
        Find Death Star Now!
      </button>

      <div id="map" class="w-full rounded-2xl border border-slate-800 shadow-xl shadow-black/30 overflow-hidden"></div>
    </div>

    <script>

      let flag = true;

      // marker history

      let marker_history = [];

      // set map and starting location
      let map = L.map("map", { attributionControl: false }).setView([0, 0], 4);

      //setting icon marker for map
      const ISSicon = L.icon({
        iconUrl: 'https://img.icons8.com/?size=160&id=WEEuZTnto9WC&format=png',
        iconSize: [40, 40],
        iconAnchor: [20, 20],
        popupAnchor: [-3, -76],
      });

      const xwing = L.icon({
        iconUrl: "https://img.icons8.com/?size=96&id=mAKFHneLBzsq&format=png",
        iconSize: [40, 40],
        iconAnchor: [20, 20],
        popupAnchor: [-3, -76],

      });

      const mill = L.icon({
        iconUrl: "https://img.icons8.com/?size=96&id=l7jGnbjoXLoJ&format=png",
        iconSize: [30, 30],
        iconAnchor: [20, 20],
        popupAnchor: [-3, -76],

      });

      // set marker on the map

      const xwingmarker = L.marker([-80,30] , { icon: xwing , title: "XWing"}).addTo(map);
      let xwing_lat = -70.00;

      const shipmarker = L.marker ([80, -40], {icon: mill, title: 'GoodGuys'}).addTo(map);
      let mill_lat = 70.0;

      const marker = L.marker([0, 0], {
        icon: ISSicon,
        title: "Death Star",
      }).addTo(map);

      // load tiles into map
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
      }).addTo(map);

      let orbitLines = [];

      async function fetchOrbitTrack(lat, lon) {
        const now = Math.floor(Date.now() / 1000);
        const allPositions = [];

        for (let batch = 0; batch < 10; batch++) {
          const timestamps = [];
          for (let i = 0; i < 10; i++) {
            timestamps.push(now + (batch * 10 + i) * 54);
          }
          const url = `https://api.wheretheiss.at/v1/satellites/25544/positions?timestamps=${timestamps.join(",")}`;
          const res = await fetch(url);
          if (!res.ok) break;
          const batchData = await res.json();
          if (batchData.error) break;
          allPositions.push(...batchData);
          await new Promise(r => setTimeout(r, 300));
        }

        if (allPositions.length === 0) return;

        orbitLines.forEach(line => map.removeLayer(line));
        orbitLines = [];

        let segment = [];
        for (let i = 0; i < allPositions.length; i++) {
          const p = allPositions[i];
          if (i > 0) {
            const prev = allPositions[i - 1];
            if (Math.abs(p.longitude - prev.longitude) > 180) {
              orbitLines.push(L.polyline(segment, { color: "#38bdf8", weight: 2, opacity: 0.5, dashArray: "6 8" }).addTo(map));
              segment = [];
            }
          }
          segment.push([p.latitude, p.longitude]);
        }
        if (segment.length > 1) {
          orbitLines.push(L.polyline(segment, { color: "#38bdf8", weight: 2, opacity: 0.5, dashArray: "6 8" }).addTo(map));
        }
      }

      async function ISSdata() {
        try {
          const iss_url = "https://api.wheretheiss.at/v1/satellites/25544";

          const response = await fetch(iss_url);
          const iss_data = await response.json();

          if (iss_data.error) return;

          let { latitude, longitude, velocity, altitude } = iss_data;

          document.getElementById("latitude").innerText =
            latitude.toFixed(3) + "°";
          document.getElementById("longitude").innerText =
            longitude.toFixed(3) + "°";
          document.getElementById("velocity").innerText =
            velocity.toFixed(1) + " kph";
          document.getElementById("altitude").innerText =
            altitude.toFixed(1) + " km";

          if (flag) {
            map.setView([latitude, longitude], 2);
            flag = false;
          }
          marker.setLatLng([latitude, longitude]);
        } catch (e) {}

        if (xwing_lat >= 80.0) {
            xwing_lat = -80.0;
        } else {
            xwingmarker.setLatLng([xwing_lat, 80]);
            xwing_lat = xwing_lat + .5;
        }

        if (mill_lat <= -70) {
            mill_lat = 80.0;
        } else {
            shipmarker.setLatLng([mill_lat, -40]);
            mill_lat = mill_lat - .1;
        }
      }

      function findStar() {
        flag = true;
      }

      ISSdata();
      fetchOrbitTrack();
      setInterval(ISSdata, 5000);
      setInterval(fetchOrbitTrack, 300000);
      setInterval(findStar, 200000);
    </script>
  </body>
</html>
